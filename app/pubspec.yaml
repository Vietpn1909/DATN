name: safewalk_hanoi
description: AI Navigation App for Visually Impaired - Hanoi Old Quarter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Data models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Camera & ML
  camera: ^0.11.0+2
  tflite_flutter: ^0.11.0
  image: ^4.2.0

  # Voice I/O
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0

  # Maps & Location (Phase 2) — Goong API + flutter_map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  dio: ^5.4.0

  # Utilities
  permission_handler: ^11.3.1
  flutter_dotenv: ^5.1.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/config/
